# Alternative: Render web service for fod.glinfico.com
services:
  - type: web
    name: glinfico-control-center
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Secrets (set in Render dashboard): DATABASE_URL (Supabase),
      # IDIQ_API_KEY, IDIQ_PARTNER_ID, FINGOAL_API_KEY, DATA_LINK_API_KEY,
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER,
      # SENDGRID_API_KEY, SENDGRID_FROM, IDE_WEBHOOK_URL, CONSENT_SIGNING_SECRET,
      # NEXT_PUBLIC_APP_URL = https://fod.glinfico.com
    healthCheckPath: /api/health
EOF
